name: release

# Tag a release with:  git tag v1.2.0 && git push origin v1.2.0
# The tag must match __version__ in claude_glance/__init__.py.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' claude_glance/__init__.py)"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match __version__ $pkg" >&2
            exit 1
          fi
          echo "Releasing $pkg"

      - name: Run tests
        run: |
          python3 tests/test_collector.py
          python3 tests/test_config.py

      - name: Build the .deb
        run: python3 tools/make_deb.py dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
